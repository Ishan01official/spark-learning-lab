<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Delta Lake flow</title>
  <desc id="desc">Delta Lake combines Parquet files with a transaction log to create table snapshots.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1a73e8"/></marker>
    <style>.box{fill:#fff;stroke:#202124;stroke-width:2;rx:9}.log{fill:#fff8e1;stroke:#f29900;stroke-width:2;rx:9}.snap{fill:#f8fbff;stroke:#1a73e8;stroke-width:2;rx:9}.txt{font:16px Arial,sans-serif;fill:#202124}.small{font:13px Arial,sans-serif;fill:#5f6368}.arrow{stroke:#1a73e8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="42" text-anchor="middle" class="txt" font-weight="700">Delta Lake = Files + Transaction Log</text>
  <rect x="70" y="120" width="190" height="80" class="box"/><text x="165" y="153" text-anchor="middle" class="txt">Spark write</text><text x="165" y="178" text-anchor="middle" class="small">append, overwrite, MERGE</text>
  <rect x="345" y="90" width="190" height="100" class="log"/><text x="440" y="128" text-anchor="middle" class="txt" font-weight="700">_delta_log</text><text x="440" y="154" text-anchor="middle" class="small">commit JSON</text><text x="440" y="176" text-anchor="middle" class="small">checkpoints</text>
  <rect x="345" y="255" width="190" height="100" class="box"/><text x="440" y="293" text-anchor="middle" class="txt" font-weight="700">Parquet files</text><text x="440" y="319" text-anchor="middle" class="small">added and removed</text>
  <rect x="630" y="170" width="200" height="100" class="snap"/><text x="730" y="208" text-anchor="middle" class="txt" font-weight="700">Snapshot version N</text><text x="730" y="234" text-anchor="middle" class="small">active file list</text>
  <rect x="630" y="335" width="200" height="70" class="box"/><text x="730" y="365" text-anchor="middle" class="txt">Readers</text><text x="730" y="389" text-anchor="middle" class="small">current or time travel</text>
  <path d="M260 155 H345" class="arrow"/><path d="M260 170 C300 235,310 280,345 305" class="arrow"/>
  <path d="M535 140 C585 150,600 185,630 205" class="arrow"/><path d="M535 305 C585 290,600 250,630 235" class="arrow"/>
  <path d="M730 270 V335" class="arrow"/>
</svg>
