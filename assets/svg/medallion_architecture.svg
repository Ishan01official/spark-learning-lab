<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Medallion architecture</title>
  <desc id="desc">Data moves from Bronze raw layer to Silver clean layer to Gold serving layer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1a73e8"/></marker>
    <style>.bronze{fill:#fff4e6;stroke:#a65f00;stroke-width:2;rx:12}.silver{fill:#f5f7fa;stroke:#5f6368;stroke-width:2;rx:12}.gold{fill:#fff8d6;stroke:#f29900;stroke-width:2;rx:12}.box{fill:#fff;stroke:#202124;stroke-width:2;rx:10}.txt{font:16px Arial,sans-serif;fill:#202124}.small{font:13px Arial,sans-serif;fill:#5f6368}.arrow{stroke:#1a73e8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="900" height="430" fill="#fff"/>
  <text x="450" y="42" text-anchor="middle" class="txt" font-weight="700">Medallion Architecture</text>
  <rect x="45" y="160" width="135" height="75" class="box"/><text x="113" y="191" text-anchor="middle" class="txt">Sources</text><text x="113" y="215" text-anchor="middle" class="small">files, events, DBs</text>
  <rect x="235" y="125" width="170" height="145" class="bronze"/><text x="320" y="170" text-anchor="middle" class="txt" font-weight="700">Bronze</text><text x="320" y="198" text-anchor="middle" class="small">raw, replayable</text><text x="320" y="222" text-anchor="middle" class="small">append-friendly</text>
  <rect x="455" y="125" width="170" height="145" class="silver"/><text x="540" y="170" text-anchor="middle" class="txt" font-weight="700">Silver</text><text x="540" y="198" text-anchor="middle" class="small">clean, typed</text><text x="540" y="222" text-anchor="middle" class="small">deduped, conformed</text>
  <rect x="675" y="125" width="170" height="145" class="gold"/><text x="760" y="170" text-anchor="middle" class="txt" font-weight="700">Gold</text><text x="760" y="198" text-anchor="middle" class="small">business-ready</text><text x="760" y="222" text-anchor="middle" class="small">metrics and marts</text>
  <path d="M180 198 H235" class="arrow"/><path d="M405 198 H455" class="arrow"/><path d="M625 198 H675" class="arrow"/>
  <text x="320" y="315" text-anchor="middle" class="small">load checks</text><text x="540" y="315" text-anchor="middle" class="small">quality rules</text><text x="760" y="315" text-anchor="middle" class="small">business validation</text>
</svg>
