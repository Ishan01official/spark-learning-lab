<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delta Lake Animation</title>
  <style>
    body{margin:0;background:#fff;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:24px}svg{width:100%;height:auto;border:1px solid #e8eaed;border-radius:8px}
    .box{fill:#fff;stroke:#202124;stroke-width:2;rx:10}.log{fill:#fff8e1;stroke:#f29900;stroke-width:2;rx:10}.snap{fill:#f8fbff;stroke:#1a73e8;stroke-width:2;rx:10}.file{fill:#fff;stroke:#5f6368;stroke-width:1.5;rx:4}.txt{font:16px Arial,sans-serif;fill:#202124}.small{font:13px Arial,sans-serif;fill:#5f6368}.arrow{stroke:#1a73e8;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .commit{opacity:0;animation:commit 6s infinite}.reader{opacity:.25;animation:reader 6s infinite}.active{animation:filePulse 6s infinite}
    @keyframes commit{0%,20%{opacity:0;transform:translateY(8px)}30%,80%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    @keyframes reader{0%,45%{opacity:.25}55%,90%{opacity:1}100%{opacity:.25}}
    @keyframes filePulse{0%,45%{stroke:#5f6368;stroke-width:1.5}55%,88%{stroke:#1a73e8;stroke-width:3}100%{stroke:#5f6368;stroke-width:1.5}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.commit,.reader{opacity:1}}
  </style>
</head>
<body>
<main class="wrap">
<svg viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Delta Lake transaction log animation</title>
  <desc id="desc">A commit updates the Delta log, and a reader uses the log to select active files.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1a73e8"/></marker></defs>
  <text x="460" y="42" text-anchor="middle" class="txt" font-weight="700">Delta Lake: the log defines the table snapshot</text>
  <rect x="70" y="150" width="160" height="75" class="box"/><text x="150" y="184" text-anchor="middle" class="txt">Spark write</text><text x="150" y="208" text-anchor="middle" class="small">append or MERGE</text>
  <rect x="345" y="85" width="190" height="105" class="log"/><text x="440" y="124" text-anchor="middle" class="txt" font-weight="700">_delta_log</text><text x="440" y="150" text-anchor="middle" class="small">commit history</text>
  <g class="commit"><rect x="380" y="205" width="120" height="42" class="log"/><text x="440" y="232" text-anchor="middle" class="small">new commit</text></g>
  <g><rect x="335" y="295" width="70" height="42" class="file active"/><rect x="425" y="295" width="70" height="42" class="file active"/><rect x="515" y="295" width="70" height="42" class="file"/><text x="460" y="365" text-anchor="middle" class="small">Parquet data files</text></g>
  <rect x="665" y="150" width="190" height="85" class="snap"/><text x="760" y="185" text-anchor="middle" class="txt">Snapshot</text><text x="760" y="210" text-anchor="middle" class="small">active files for version N</text>
  <g class="reader"><circle cx="760" cy="312" r="28" fill="#f8fbff" stroke="#1a73e8" stroke-width="2"/><text x="760" y="318" text-anchor="middle" class="small">read</text></g>
  <path d="M230 188 H345" class="arrow"/><path d="M500 226 C575 220,610 200,665 190" class="arrow"/><path d="M535 137 C590 145,620 160,665 178" class="arrow"/><path d="M760 235 V284" class="arrow"/>
</svg>
</main>
</body>
</html>
