<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shuffle Flow Animation</title>
  <style>

    body { margin:0; background:#fffdf8; color:#202124; font-family: Arial, sans-serif; }
    main { max-width: 1120px; margin: 0 auto; padding: 20px; }
    .controls { display:flex; gap:10px; margin: 0 0 14px; }
    button { border:2px solid #202124; background:#fff; border-radius:7px; padding:8px 12px; font: 15px Arial, sans-serif; cursor:pointer; }
    svg { width:100%; height:auto; border:1px solid #e8eaed; border-radius:8px; background:#fffdf8; }
    .sketch { stroke:#202124; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; fill:none; }
    .paper { fill:#fffdf8; }
    .texture { fill:none; stroke:#202124; stroke-width:1.1; opacity:.045; }
    .accent-red { stroke:#d93025; fill:none; }
    .accent-blue { stroke:#1a73e8; fill:none; }
    .accent-orange { stroke:#f29900; fill:none; }
    .label { font:700 30px Arial, sans-serif; fill:#202124; }
    .note { font:22px Arial, sans-serif; fill:#3c4043; }
    .tiny { font:18px Arial, sans-serif; fill:#5f6368; }
    .box { fill:#fffefa; stroke:#202124; stroke-width:3; rx:14; }
    .soft { fill:#f8fbff; stroke:#1a73e8; stroke-width:3; rx:14; }
    .warn { fill:#fff7e6; stroke:#d93025; stroke-width:3; rx:14; }
    .token { fill:#1a73e8; stroke:#202124; stroke-width:2; }
    .paused svg * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; opacity: 1 !important; } }


    .rec{opacity:0}.r1{animation:move1 7s infinite}.r2{animation:move2 7s infinite .45s}.r3{animation:move3 7s infinite .9s}.r4{animation:move4 7s infinite 1.35s}
    @keyframes move1{0%{opacity:0;transform:translate(150px,188px)}10%{opacity:1}45%{transform:translate(610px,318px)}78%,100%{transform:translate(1080px,188px);opacity:0}}
    @keyframes move2{0%{opacity:0;transform:translate(150px,323px)}10%{opacity:1}45%{transform:translate(620px,330px)}78%,100%{transform:translate(1080px,323px);opacity:0}}
    @keyframes move3{0%{opacity:0;transform:translate(150px,458px)}10%{opacity:1}45%{transform:translate(600px,350px)}78%,100%{transform:translate(1080px,458px);opacity:0}}
    @keyframes move4{0%{opacity:0;transform:translate(180px,188px)}10%{opacity:1}45%{transform:translate(640px,300px)}78%,100%{transform:translate(1110px,458px);opacity:0}}

  </style>
</head>
<body>
<main>
  <div class="controls" aria-label="Animation controls">
    <button type="button" id="play">Play</button>
    <button type="button" id="pause">Pause</button>
    <button type="button" id="restart">Restart</button>
  </div>
  <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
    <title id="title">Shuffle Flow Animation</title>
    <desc id="desc">Records cross the network and form new partitions after an expensive boundary.</desc>
    <defs>
      <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#1a73e8"/></marker>
      <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#d93025"/></marker>
      <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#f29900"/></marker>
    </defs>
    <rect width="1280" height="720" class="paper"/>
    <path d="M60 85 C260 55,430 95,610 68 S900 85,1210 58" class="texture"/>
    <path d="M80 650 C260 625,390 665,560 635 S890 660,1210 628" class="texture"/>
    <text x="640" y="56" text-anchor="middle" class="label">Shuffle Flow Animation</text>
    <text x="640" y="90" text-anchor="middle" class="note">Records cross the network and form new partitions after an expensive boundary.</text>

    <rect x="70" y="150" width="165" height="75" class="box"/><text x="152.5" y="196.5" text-anchor="middle" class="note">Input P1</text><rect x="70" y="285" width="165" height="75" class="box"/><text x="152.5" y="331.5" text-anchor="middle" class="note">Input P2</text><rect x="70" y="420" width="165" height="75" class="box"/><text x="152.5" y="466.5" text-anchor="middle" class="note">Input P3</text>
    <rect x="510" y="260" width="210" height="115" class="warn"/><text x="615.0" y="326.5" text-anchor="middle" class="note">Shuffle exchange</text>
    <rect x="1000" y="150" width="165" height="75" class="soft"/><text x="1082.5" y="196.5" text-anchor="middle" class="note">Output A</text><rect x="1000" y="285" width="165" height="75" class="soft"/><text x="1082.5" y="331.5" text-anchor="middle" class="note">Output B/C</text><rect x="1000" y="420" width="165" height="75" class="soft"/><text x="1082.5" y="466.5" text-anchor="middle" class="note">Output D</text>
    <path d="M235 188 C360 150,420 260,510 300" class="sketch accent-red" stroke-dasharray="10 8"/><path d="M235 323 C360 315,420 315,510 320" class="sketch accent-red" stroke-dasharray="10 8"/><path d="M235 458 C370 500,420 395,510 350" class="sketch accent-red" stroke-dasharray="10 8"/>
    <path d="M720 300 C835 220,905 180,1000 188" class="sketch accent-orange"/><path d="M720 320 C835 318,905 320,1000 323" class="sketch accent-orange"/><path d="M720 350 C835 410,905 455,1000 458" class="sketch accent-orange"/>
    <text x="605" y="430" text-anchor="middle" class="note" fill="#d93025">expensive boundary: network + disk</text>
    <circle r="12" class="token rec r1"/><circle r="12" class="token rec r2"/><circle r="12" class="token rec r3"/><circle r="12" class="token rec r4"/>

  </svg>
</main>
<script>
  const body = document.body;
  const svg = document.querySelector('svg');
  document.getElementById('play').addEventListener('click', () => body.classList.remove('paused'));
  document.getElementById('pause').addEventListener('click', () => body.classList.add('paused'));
  document.getElementById('restart').addEventListener('click', () => {
    body.classList.remove('paused');
    svg.style.display = 'none';
    void svg.offsetWidth;
    svg.style.display = 'block';
  });
</script>
</body>
</html>
