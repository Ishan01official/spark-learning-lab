<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spark UI Debugging Flow Animation</title>
  <style>

    body { margin:0; background:#fffdf8; color:#202124; font-family: Arial, sans-serif; }
    main { max-width: 1120px; margin: 0 auto; padding: 20px; }
    .controls { display:flex; gap:10px; margin: 0 0 14px; }
    button { border:2px solid #202124; background:#fff; border-radius:7px; padding:8px 12px; font: 15px Arial, sans-serif; cursor:pointer; }
    svg { width:100%; height:auto; border:1px solid #e8eaed; border-radius:8px; background:#fffdf8; }
    .sketch { stroke:#202124; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; fill:none; }
    .paper { fill:#fffdf8; }
    .texture { fill:none; stroke:#202124; stroke-width:1.1; opacity:.045; }
    .accent-red { stroke:#d93025; fill:none; }
    .accent-blue { stroke:#1a73e8; fill:none; }
    .accent-orange { stroke:#f29900; fill:none; }
    .label { font:700 30px Arial, sans-serif; fill:#202124; }
    .note { font:22px Arial, sans-serif; fill:#3c4043; }
    .tiny { font:18px Arial, sans-serif; fill:#5f6368; }
    .box { fill:#fffefa; stroke:#202124; stroke-width:3; rx:14; }
    .soft { fill:#f8fbff; stroke:#1a73e8; stroke-width:3; rx:14; }
    .warn { fill:#fff7e6; stroke:#d93025; stroke-width:3; rx:14; }
    .token { fill:#1a73e8; stroke:#202124; stroke-width:2; }
    .paused svg * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; opacity: 1 !important; } }


    .bars{opacity:0;animation:show 7s infinite 2.4s}.meter{opacity:0;animation:show 7s infinite 4.1s}
    @keyframes show{0%,25%{opacity:0;transform:translateY(12px)}35%,88%{opacity:1;transform:translateY(0)}100%{opacity:0}}

  </style>
</head>
<body>
<main>
  <div class="controls" aria-label="Animation controls">
    <button type="button" id="play">Play</button>
    <button type="button" id="pause">Pause</button>
    <button type="button" id="restart">Restart</button>
  </div>
  <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
    <title id="title">Spark UI Debugging Flow Animation</title>
    <desc id="desc">Failed job leads to stages, skew metrics, shuffle metrics, then a focused fix.</desc>
    <defs>
      <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#1a73e8"/></marker>
      <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#d93025"/></marker>
      <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#f29900"/></marker>
    </defs>
    <rect width="1280" height="720" class="paper"/>
    <path d="M60 85 C260 55,430 95,610 68 S900 85,1210 58" class="texture"/>
    <path d="M80 650 C260 625,390 665,560 635 S890 660,1210 628" class="texture"/>
    <text x="640" y="56" text-anchor="middle" class="label">Spark UI Debugging Flow Animation</text>
    <text x="640" y="90" text-anchor="middle" class="note">Failed job leads to stages, skew metrics, shuffle metrics, then a focused fix.</text>

    <rect x="70" y="190" width="180" height="90" class="warn"/><text x="160.0" y="244.0" text-anchor="middle" class="note">Failed job</text><rect x="350" y="160" width="180" height="90" class="soft"/><text x="440.0" y="214.0" text-anchor="middle" class="note">Stages tab</text><rect x="630" y="160" width="210" height="90" class="warn"/><text x="735.0" y="214.0" text-anchor="middle" class="note">Task skew</text><rect x="630" y="390" width="210" height="90" class="box"/><text x="735.0" y="444.0" text-anchor="middle" class="note">Shuffle read/write</text><rect x="955" y="270" width="210" height="90" class="soft"/><text x="1060.0" y="324.0" text-anchor="middle" class="note">Fix + rerun</text>
    <path d="M250 235 C300 190,320 190,350 205" class="sketch accent-blue" marker-end="url(#arrow-blue)"/><path d="M530 205 C575 180,600 180,630 205" class="sketch accent-red" marker-end="url(#arrow-red)"/><path d="M735 250 C725 300,725 345,735 390" class="sketch accent-orange" marker-end="url(#arrow-orange)"/><path d="M840 435 C910 410,930 335,955 315" class="sketch accent-blue" marker-end="url(#arrow-blue)"/>
    <g class="bars"><rect x="660" y="245" width="38" height="50" fill="#1a73e8"/><rect x="710" y="245" width="38" height="85" fill="#1a73e8"/><rect x="760" y="245" width="38" height="150" fill="#d93025"/></g>
    <g class="meter"><path d="M675 505 C730 535,795 535,825 505" class="sketch accent-orange"/><text x="750" y="555" text-anchor="middle" class="note">confirm with metrics</text></g>

  </svg>
</main>
<script>
  const body = document.body;
  const svg = document.querySelector('svg');
  document.getElementById('play').addEventListener('click', () => body.classList.remove('paused'));
  document.getElementById('pause').addEventListener('click', () => body.classList.add('paused'));
  document.getElementById('restart').addEventListener('click', () => {
    body.classList.remove('paused');
    svg.style.display = 'none';
    void svg.offsetWidth;
    svg.style.display = 'block';
  });
</script>
</body>
</html>
