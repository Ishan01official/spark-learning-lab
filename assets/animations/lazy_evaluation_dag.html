<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazy Evaluation DAG Animation</title>
  <style>

    body { margin:0; background:#fffdf8; color:#202124; font-family: Arial, sans-serif; }
    main { max-width: 1120px; margin: 0 auto; padding: 20px; }
    .controls { display:flex; gap:10px; margin: 0 0 14px; }
    button { border:2px solid #202124; background:#fff; border-radius:7px; padding:8px 12px; font: 15px Arial, sans-serif; cursor:pointer; }
    svg { width:100%; height:auto; border:1px solid #e8eaed; border-radius:8px; background:#fffdf8; }
    .sketch { stroke:#202124; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; fill:none; }
    .paper { fill:#fffdf8; }
    .texture { fill:none; stroke:#202124; stroke-width:1.1; opacity:.045; }
    .accent-red { stroke:#d93025; fill:none; }
    .accent-blue { stroke:#1a73e8; fill:none; }
    .accent-orange { stroke:#f29900; fill:none; }
    .label { font:700 30px Arial, sans-serif; fill:#202124; }
    .note { font:22px Arial, sans-serif; fill:#3c4043; }
    .tiny { font:18px Arial, sans-serif; fill:#5f6368; }
    .box { fill:#fffefa; stroke:#202124; stroke-width:3; rx:14; }
    .soft { fill:#f8fbff; stroke:#1a73e8; stroke-width:3; rx:14; }
    .warn { fill:#fff7e6; stroke:#d93025; stroke-width:3; rx:14; }
    .token { fill:#1a73e8; stroke:#202124; stroke-width:2; }
    .paused svg * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; opacity: 1 !important; } }


    .plan,.action,.dag,.runtime{opacity:0}.p1{animation:show 10s infinite .2s}.p2{animation:show 10s infinite .9s}.p3{animation:show 10s infinite 1.6s}.p4{animation:show 10s infinite 2.3s}.action{animation:pulseShow 10s infinite 3.2s}.dag{animation:show 10s infinite 4.8s}.runtime{animation:show 10s infinite 6.2s}.task{animation:bounce 10s infinite 6.8s}
    @keyframes show{0%,6%{opacity:0;transform:translateY(10px)}12%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    @keyframes pulseShow{0%,8%{opacity:0;transform:scale(.95)}15%,86%{opacity:1;transform:scale(1.03)}25%,90%{transform:scale(1)}100%{opacity:0}}
    @keyframes bounce{0%,60%{transform:translateY(0)}66%{transform:translateY(-10px)}72%,100%{transform:translateY(0)}}

  </style>
</head>
<body>
<main>
  <div class="controls" aria-label="Animation controls">
    <button type="button" id="play">Play</button>
    <button type="button" id="pause">Pause</button>
    <button type="button" id="restart">Restart</button>
  </div>
  <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
    <title id="title">Lazy Evaluation DAG Animation</title>
    <desc id="desc">Plan first, action triggers DAG, then job, stages, and tasks.</desc>
    <defs>
      <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#1a73e8"/></marker>
      <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#d93025"/></marker>
      <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#f29900"/></marker>
    </defs>
    <rect width="1280" height="720" class="paper"/>
    <path d="M60 85 C260 55,430 95,610 68 S900 85,1210 58" class="texture"/>
    <path d="M80 650 C260 625,390 665,560 635 S890 660,1210 628" class="texture"/>
    <text x="640" y="56" text-anchor="middle" class="label">Lazy Evaluation DAG Animation</text>
    <text x="640" y="90" text-anchor="middle" class="note">Plan first, action triggers DAG, then job, stages, and tasks.</text>

    <g class="plan p1"><rect x="70" y="155" width="130" height="70" class="box"/><text x="135.0" y="199.0" text-anchor="middle" class="note">read</text></g>
    <g class="plan p2"><rect x="240" y="155" width="130" height="70" class="box"/><text x="305.0" y="199.0" text-anchor="middle" class="note">filter</text></g>
    <g class="plan p3"><rect x="410" y="155" width="130" height="70" class="box"/><text x="475.0" y="199.0" text-anchor="middle" class="note">select</text></g>
    <g class="plan p4"><rect x="580" y="155" width="150" height="70" class="box"/><text x="655.0" y="199.0" text-anchor="middle" class="note">groupBy</text></g>
    <g class="action"><rect x="835" y="135" width="170" height="110" class="warn"/><text x="920.0" y="199.0" text-anchor="middle" class="note">ACTION</text></g>
    <path d="M200 190 C220 175,225 175,240 190" class="sketch accent-blue" marker-end="url(#arrow-blue)"/><path d="M370 190 C390 175,395 175,410 190" class="sketch accent-blue" marker-end="url(#arrow-blue)"/><path d="M540 190 C560 175,565 175,580 190" class="sketch accent-blue" marker-end="url(#arrow-blue)"/><path d="M730 190 C780 160,805 165,835 190" class="sketch accent-red" marker-end="url(#arrow-red)"/>
    <g class="dag"><circle cx="235" cy="435" r="18" class="token"/><circle cx="340" cy="385" r="18" class="token"/><circle cx="450" cy="445" r="18" class="token"/><path d="M253 428 C285 405,305 395,322 390 M358 393 C390 405,420 425,432 438" class="sketch accent-blue"/><text x="340" y="505" text-anchor="middle" class="note">DAG appears</text></g>
    <g class="runtime"><rect x="600" y="395" width="135" height="80" class="soft"/><text x="667.5" y="444.0" text-anchor="middle" class="note">Job 0</text><rect x="805" y="360" width="155" height="75" class="box"/><text x="882.5" y="406.5" text-anchor="middle" class="note">Stage 0</text><rect x="990" y="475" width="155" height="75" class="box"/><text x="1067.5" y="521.5" text-anchor="middle" class="note">Stage 1</text><path d="M735 435 C775 390,790 390,805 398" class="sketch accent-blue" marker-end="url(#arrow-blue)"/><path d="M960 400 C1015 420,1045 445,1065 475" class="sketch accent-red" marker-end="url(#arrow-red)"/><text x="930" y="468" class="tiny" fill="#d93025">shuffle split</text><circle cx="840" cy="455" r="10" class="task t1"/><circle cx="880" cy="455" r="10" class="task t2"/><circle cx="1030" cy="570" r="10" class="task t3"/><circle cx="1070" cy="570" r="10" class="task t4"/></g>

  </svg>
</main>
<script>
  const body = document.body;
  const svg = document.querySelector('svg');
  document.getElementById('play').addEventListener('click', () => body.classList.remove('paused'));
  document.getElementById('pause').addEventListener('click', () => body.classList.add('paused'));
  document.getElementById('restart').addEventListener('click', () => {
    body.classList.remove('paused');
    svg.style.display = 'none';
    void svg.offsetWidth;
    svg.style.display = 'block';
  });
</script>
</body>
</html>
