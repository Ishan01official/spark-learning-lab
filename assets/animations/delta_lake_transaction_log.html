<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delta Lake Transaction Log Animation</title>
  <style>

    body { margin:0; background:#fffdf8; color:#202124; font-family: Arial, sans-serif; }
    main { max-width: 1120px; margin: 0 auto; padding: 20px; }
    .controls { display:flex; gap:10px; margin: 0 0 14px; }
    button { border:2px solid #202124; background:#fff; border-radius:7px; padding:8px 12px; font: 15px Arial, sans-serif; cursor:pointer; }
    svg { width:100%; height:auto; border:1px solid #e8eaed; border-radius:8px; background:#fffdf8; }
    .sketch { stroke:#202124; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; fill:none; }
    .paper { fill:#fffdf8; }
    .texture { fill:none; stroke:#202124; stroke-width:1.1; opacity:.045; }
    .accent-red { stroke:#d93025; fill:none; }
    .accent-blue { stroke:#1a73e8; fill:none; }
    .accent-orange { stroke:#f29900; fill:none; }
    .label { font:700 30px Arial, sans-serif; fill:#202124; }
    .note { font:22px Arial, sans-serif; fill:#3c4043; }
    .tiny { font:18px Arial, sans-serif; fill:#5f6368; }
    .box { fill:#fffefa; stroke:#202124; stroke-width:3; rx:14; }
    .soft { fill:#f8fbff; stroke:#1a73e8; stroke-width:3; rx:14; }
    .warn { fill:#fff7e6; stroke:#d93025; stroke-width:3; rx:14; }
    .token { fill:#1a73e8; stroke:#202124; stroke-width:2; }
    .paused svg * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; opacity: 1 !important; } }


    .commit{opacity:0;animation:commit 7s infinite 1.2s}.files{animation:filePulse 7s infinite 2.6s}.travel{opacity:0;animation:fade 7s infinite 4.4s}
    @keyframes commit{0%,15%{opacity:0;transform:translateY(18px)}25%,80%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    @keyframes filePulse{0%,40%{opacity:.55}50%,85%{opacity:1}100%{opacity:.55}}
    @keyframes fade{0%,55%{opacity:0}65%,90%{opacity:1}100%{opacity:0}}

  </style>
</head>
<body>
<main>
  <div class="controls" aria-label="Animation controls">
    <button type="button" id="play">Play</button>
    <button type="button" id="pause">Pause</button>
    <button type="button" id="restart">Restart</button>
  </div>
  <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
    <title id="title">Delta Lake Transaction Log Animation</title>
    <desc id="desc">Commits update _delta_log; readers build snapshots and can time travel.</desc>
    <defs>
      <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#1a73e8"/></marker>
      <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#d93025"/></marker>
      <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#f29900"/></marker>
    </defs>
    <rect width="1280" height="720" class="paper"/>
    <path d="M60 85 C260 55,430 95,610 68 S900 85,1210 58" class="texture"/>
    <path d="M80 650 C260 625,390 665,560 635 S890 660,1210 628" class="texture"/>
    <text x="640" y="56" text-anchor="middle" class="label">Delta Lake Transaction Log Animation</text>
    <text x="640" y="90" text-anchor="middle" class="note">Commits update _delta_log; readers build snapshots and can time travel.</text>

    <rect x="80" y="190" width="180" height="85" class="box"/><text x="170.0" y="241.5" text-anchor="middle" class="note">Spark write</text><rect x="455" y="115" width="310" height="130" class="warn"/><text x="610.0" y="189.0" text-anchor="middle" class="note">_delta_log</text><rect x="430" y="410" width="360" height="115" class="box"/><text x="610.0" y="476.5" text-anchor="middle" class="note">Parquet files</text><rect x="940" y="245" width="210" height="115" class="soft"/><text x="1045.0" y="311.5" text-anchor="middle" class="note">Snapshot</text>
    <path d="M260 220 C340 145,390 150,455 165" class="sketch accent-blue" marker-end="url(#arrow-blue)"/><path d="M260 245 C335 370,385 430,430 455" class="sketch accent-orange" marker-end="url(#arrow-orange)"/><path d="M765 175 C850 180,890 230,940 275" class="sketch accent-blue" marker-end="url(#arrow-blue)"/><path d="M790 455 C860 420,900 350,940 320" class="sketch accent-blue" marker-end="url(#arrow-blue)"/>
    <g class="commit"><rect x="535" y="275" width="150" height="45" class="warn"/><text x="610" y="305" text-anchor="middle" class="tiny">commit JSON</text></g>
    <g class="files"><rect x="480" y="455" width="60" height="42" class="box"/><rect x="565" y="455" width="60" height="42" class="box"/><rect x="650" y="455" width="60" height="42" class="box"/></g>
    <g class="travel"><path d="M1045 360 C1110 425,1040 485,970 445" class="sketch accent-red" marker-end="url(#arrow-red)"/><text x="1020" y="500" class="note" fill="#d93025">time travel</text></g>

  </svg>
</main>
<script>
  const body = document.body;
  const svg = document.querySelector('svg');
  document.getElementById('play').addEventListener('click', () => body.classList.remove('paused'));
  document.getElementById('pause').addEventListener('click', () => body.classList.add('paused'));
  document.getElementById('restart').addEventListener('click', () => {
    body.classList.remove('paused');
    svg.style.display = 'none';
    void svg.offsetWidth;
    svg.style.display = 'block';
  });
</script>
</body>
</html>
