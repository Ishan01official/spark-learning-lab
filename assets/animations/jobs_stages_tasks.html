<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobs, Stages, and Tasks Animation</title>
  <style>

    body { margin:0; background:#fffdf8; color:#202124; font-family: Arial, sans-serif; }
    main { max-width: 1120px; margin: 0 auto; padding: 20px; }
    .controls { display:flex; gap:10px; margin: 0 0 14px; }
    button { border:2px solid #202124; background:#fff; border-radius:7px; padding:8px 12px; font: 15px Arial, sans-serif; cursor:pointer; }
    svg { width:100%; height:auto; border:1px solid #e8eaed; border-radius:8px; background:#fffdf8; }
    .sketch { stroke:#202124; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; fill:none; }
    .paper { fill:#fffdf8; }
    .texture { fill:none; stroke:#202124; stroke-width:1.1; opacity:.045; }
    .accent-red { stroke:#d93025; fill:none; }
    .accent-blue { stroke:#1a73e8; fill:none; }
    .accent-orange { stroke:#f29900; fill:none; }
    .label { font:700 30px Arial, sans-serif; fill:#202124; }
    .note { font:22px Arial, sans-serif; fill:#3c4043; }
    .tiny { font:18px Arial, sans-serif; fill:#5f6368; }
    .box { fill:#fffefa; stroke:#202124; stroke-width:3; rx:14; }
    .soft { fill:#f8fbff; stroke:#1a73e8; stroke-width:3; rx:14; }
    .warn { fill:#fff7e6; stroke:#d93025; stroke-width:3; rx:14; }
    .token { fill:#1a73e8; stroke:#202124; stroke-width:2; }
    .paused svg * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; opacity: 1 !important; } }


    .a,.j,.s0,.river,.s1,.tasks{opacity:0}.a{animation:fade 9s infinite .2s}.j{animation:fade 9s infinite 1.4s}.s0{animation:fade 9s infinite 2.6s}.river{animation:fade 9s infinite 3.8s}.s1{animation:fade 9s infinite 5s}.tasks{animation:fade 9s infinite 6.2s}.token{animation:pop 9s infinite 6.4s}
    @keyframes fade{0%,8%{opacity:0;transform:translateY(8px)}15%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    @keyframes pop{0%,62%{transform:scale(.7)}70%,100%{transform:scale(1)}}

  </style>
</head>
<body>
<main>
  <div class="controls" aria-label="Animation controls">
    <button type="button" id="play">Play</button>
    <button type="button" id="pause">Pause</button>
    <button type="button" id="restart">Restart</button>
  </div>
  <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
    <title id="title">Jobs, Stages, and Tasks Animation</title>
    <desc id="desc">One action creates a job; shuffle boundaries split stages; partitions become tasks.</desc>
    <defs>
      <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#1a73e8"/></marker>
      <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#d93025"/></marker>
      <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#f29900"/></marker>
    </defs>
    <rect width="1280" height="720" class="paper"/>
    <path d="M60 85 C260 55,430 95,610 68 S900 85,1210 58" class="texture"/>
    <path d="M80 650 C260 625,390 665,560 635 S890 660,1210 628" class="texture"/>
    <text x="640" y="56" text-anchor="middle" class="label">Jobs, Stages, and Tasks Animation</text>
    <text x="640" y="90" text-anchor="middle" class="note">One action creates a job; shuffle boundaries split stages; partitions become tasks.</text>

    <g class="a"><rect x="85" y="180" width="150" height="85" class="warn"/><text x="160.0" y="231.5" text-anchor="middle" class="note">Action</text></g>
    <g class="j"><rect x="330" y="172" width="150" height="100" class="soft"/><text x="405.0" y="231.0" text-anchor="middle" class="note">Job 0</text></g>
    <g class="s0"><rect x="610" y="125" width="210" height="115" class="box"/><text x="715.0" y="191.5" text-anchor="middle" class="note">Stage 0</text></g>
    <g class="river"><path d="M870 150 C930 205,940 300,910 365" class="sketch accent-red" stroke-dasharray="10 9"/><text x="920" y="275" class="note" fill="#d93025">shuffle boundary</text></g>
    <g class="s1"><rect x="930" y="410" width="210" height="115" class="box"/><text x="1035.0" y="476.5" text-anchor="middle" class="note">Stage 1</text></g>
    <path d="M235 222 C275 185,300 190,330 220" class="sketch accent-blue" marker-end="url(#arrow-blue)"/><path d="M480 220 C540 165,565 165,610 185" class="sketch accent-blue" marker-end="url(#arrow-blue)"/><path d="M820 185 C895 240,930 330,990 410" class="sketch accent-red" marker-end="url(#arrow-red)"/>
    <g class="tasks"><circle cx="655" cy="270" r="13" class="token"/><circle cx="710" cy="270" r="13" class="token"/><circle cx="765" cy="270" r="13" class="token"/><circle cx="975" cy="555" r="13" class="token"/><circle cx="1030" cy="555" r="13" class="token"/><circle cx="1085" cy="555" r="13" class="token"/><text x="840" y="630" text-anchor="middle" class="note">tasks = partitions in each stage</text></g>

  </svg>
</main>
<script>
  const body = document.body;
  const svg = document.querySelector('svg');
  document.getElementById('play').addEventListener('click', () => body.classList.remove('paused'));
  document.getElementById('pause').addEventListener('click', () => body.classList.add('paused'));
  document.getElementById('restart').addEventListener('click', () => {
    body.classList.remove('paused');
    svg.style.display = 'none';
    void svg.offsetWidth;
    svg.style.display = 'block';
  });
</script>
</body>
</html>
