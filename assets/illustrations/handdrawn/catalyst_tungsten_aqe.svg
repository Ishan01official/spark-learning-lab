<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Catalyst, Tungsten, and AQE</title>
  <desc id="desc">Plan, generate fast execution, then adapt using runtime statistics.</desc>
  <defs>
