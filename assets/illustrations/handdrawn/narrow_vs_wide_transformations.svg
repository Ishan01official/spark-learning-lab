<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Narrow vs Wide Transformations</title>
  <desc id="desc">Narrow work stays local; wide work creates a shuffle boundary.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#1a73e8"/></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#d93025"/></marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#f29900"/></marker>
    <marker id="arrow-black" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#202124"/></marker>
    <style>
    .paper { fill: #fffdf8; }
    .texture { fill: none; stroke: #202124; stroke-width: 1.2; opacity: .045; }
    .sketch { stroke: #202124; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .sketch-fill { fill: #fffefa; }
    .soft-fill { fill: #f8fbff; }
    .warm-fill { fill: #fff7e6; }
    .green-fill { fill: #f5fff7; }
    .gold-fill { fill: #fff8d6; }
    .accent-red { stroke: #d93025; fill: none; }
    .accent-blue { stroke: #1a73e8; fill: none; }
    .accent-orange { stroke: #f29900; fill: none; }
    .label { font: 700 29px Arial, sans-serif; fill: #202124; }
    .note { font: 22px Arial, sans-serif; fill: #3c4043; }
    .tiny { font: 18px Arial, sans-serif; fill: #5f6368; }
    .red-text { fill: #d93025; }
    .blue-text { fill: #1a73e8; }
    .orange-text { fill: #b06000; }
</style>
  </defs>

  <rect width="1280" height="720" class="paper"/>
  <path d="M48 78 C180 58, 260 92, 405 72 S700 88, 840 58 S1070 70, 1210 52" class="texture"/>
  <path d="M62 632 C190 610, 322 654, 480 626 S780 652, 930 622 S1110 644, 1228 615" class="texture"/>
  <circle cx="118" cy="210" r="46" class="texture"/>
  <circle cx="1150" cy="560" r="60" class="texture"/>
  <path d="M1060 120 q55 28 94 -10 q-26 56 25 82" class="texture"/>

  <text x="640" y="58" text-anchor="middle" class="label">Narrow vs Wide Transformations</text>
  <text x="640" y="91" text-anchor="middle" class="note">Narrow work stays local; wide work creates a shuffle boundary.</text>

  <text x="270" y="135" text-anchor="middle" class="label">Narrow: pipelined locally</text>
  <path d="M95,190 C165,180 160,193 222,188 C235,260 228,205 223,257 C135,272 165,263 91,260 C80,190 89,245 95,190 Z" class="sketch sketch-fill"/>
<text x="157.5" y="220.0" text-anchor="middle" class="label">P1</text>
<text x="157.5" y="250.0" text-anchor="middle" class="note">filter</text>
  <path d="M95,315 C165,305 160,318 222,313 C235,385 228,330 223,382 C135,397 165,388 91,385 C80,315 89,370 95,315 Z" class="sketch sketch-fill"/>
<text x="157.5" y="345.0" text-anchor="middle" class="label">P2</text>
<text x="157.5" y="375.0" text-anchor="middle" class="note">select</text>
  <path d="M95,440 C165,430 160,443 222,438 C235,510 228,455 223,507 C135,522 165,513 91,510 C80,440 89,495 95,440 Z" class="sketch sketch-fill"/>
<text x="157.5" y="470.0" text-anchor="middle" class="label">P3</text>
<text x="157.5" y="500.0" text-anchor="middle" class="note">map</text>
  <path d="M355,190 C425,180 420,193 482,188 C495,260 488,205 483,257 C395,272 425,263 351,260 C340,190 349,245 355,190 Z" class="sketch soft-fill"/>
<text x="417.5" y="220.0" text-anchor="middle" class="label">P1 out</text>

  <path d="M355,315 C425,305 420,318 482,313 C495,385 488,330 483,382 C395,397 425,388 351,385 C340,315 349,370 355,315 Z" class="sketch soft-fill"/>
<text x="417.5" y="345.0" text-anchor="middle" class="label">P2 out</text>

  <path d="M355,440 C425,430 420,443 482,438 C495,510 488,455 483,507 C395,522 425,513 351,510 C340,440 349,495 355,440 Z" class="sketch soft-fill"/>
<text x="417.5" y="470.0" text-anchor="middle" class="label">P3 out</text>

  <path d="M230 225 C275 205,300 205,345 225" class="sketch accent-blue" marker-end="url(#arrow-blue)"/>
  <path d="M230 350 C275 330,300 330,345 350" class="sketch accent-blue" marker-end="url(#arrow-blue)"/>
  <path d="M230 475 C275 455,300 455,345 475" class="sketch accent-blue" marker-end="url(#arrow-blue)"/>
  <text x="925" y="135" text-anchor="middle" class="label">Wide: data moves by key</text>
  <path d="M700,190 C770,180 755,193 817,188 C830,260 823,200 818,252 C730,267 770,258 696,255 C685,185 694,245 700,190 Z" class="sketch sketch-fill"/>
