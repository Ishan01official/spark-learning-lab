<text x="757.5" y="247.5" text-anchor="middle" class="note">A B C</text>
  <path d="M700,315 C770,305 755,318 817,313 C830,385 823,325 818,377 C730,392 770,383 696,380 C685,310 694,370 700,315 Z" class="sketch sketch-fill"/>
<text x="757.5" y="342.5" text-anchor="middle" class="label">P2</text>
<text x="757.5" y="372.5" text-anchor="middle" class="note">B C D</text>
  <path d="M700,440 C770,430 755,443 817,438 C830,510 823,450 818,502 C730,517 770,508 696,505 C685,435 694,495 700,440 Z" class="sketch sketch-fill"/>
<text x="757.5" y="467.5" text-anchor="middle" class="label">P3</text>
<text x="757.5" y="497.5" text-anchor="middle" class="note">A D</text>
  <path d="M925,359.4 C895,339.0 925,303.0 970,315.0 C990,280 1050,290 1065,318.6 C1065,291.0 1110,339.0 1077,369.0 C1055,415 955,413 925,359.4 Z" class="sketch soft-fill"/>
<text x="992.5" y="347.0" text-anchor="middle" class="label">shuffle</text>
<text x="992.5" y="377.0" text-anchor="middle" class="note">groupBy / join</text>
  <path d="M1120,190 C1190,180 1160,193 1222,188 C1235,260 1228,200 1223,252 C1135,267 1190,258 1116,255 C1105,185 1114,245 1120,190 Z" class="sketch soft-fill"/>
<text x="1170.0" y="217.5" text-anchor="middle" class="label">A</text>

  <path d="M1120,315 C1190,305 1160,318 1222,313 C1235,385 1228,325 1223,377 C1135,392 1190,383 1116,380 C1105,310 1114,370 1120,315 Z" class="sketch soft-fill"/>
<text x="1170.0" y="342.5" text-anchor="middle" class="label">B/C</text>

  <path d="M1120,440 C1190,430 1160,443 1222,438 C1235,510 1228,450 1223,502 C1135,517 1190,508 1116,505 C1105,435 1114,495 1120,440 Z" class="sketch soft-fill"/>
<text x="1170.0" y="467.5" text-anchor="middle" class="label">D</text>

  <path d="M825 220 C875 210,890 265,920 305" class="sketch accent-red" stroke-dasharray="10 9" marker-end="url(#arrow-red)"/>
  <path d="M825 350 C865 345,885 335,900 335" class="sketch accent-red" stroke-dasharray="10 9" marker-end="url(#arrow-red)"/>
  <path d="M825 475 C880 455,890 385,920 360" class="sketch accent-red" stroke-dasharray="10 9" marker-end="url(#arrow-red)"/>
  <path d="M1085 320 C1110 250,1110 220,1110 220" class="sketch accent-red" marker-end="url(#arrow-red)"/>
  <path d="M1085 340 C1100 340,1105 350,1110 350" class="sketch accent-red" marker-end="url(#arrow-red)"/>
  <path d="M1085 360 C1115 420,1110 475,1110 475" class="sketch accent-red" marker-end="url(#arrow-red)"/>
  <text x="810" y="575" text-anchor="middle" class="note red-text">red = expensive stage boundary</text>

</svg>
