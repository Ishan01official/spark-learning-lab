    .gold-fill { fill: #fff8d6; }
    .accent-red { stroke: #d93025; fill: none; }
    .accent-blue { stroke: #1a73e8; fill: none; }
    .accent-orange { stroke: #f29900; fill: none; }
    .label { font: 700 29px Arial, sans-serif; fill: #202124; }
    .note { font: 22px Arial, sans-serif; fill: #3c4043; }
    .tiny { font: 18px Arial, sans-serif; fill: #5f6368; }
    .red-text { fill: #d93025; }
    .blue-text { fill: #1a73e8; }
    .orange-text { fill: #b06000; }
</style>
  </defs>

