<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Spark Architecture</title>
  <desc id="desc">Driver plans. Executors process partitions. Storage keeps the data.</desc>
