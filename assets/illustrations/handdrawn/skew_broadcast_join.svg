  <path d="M285 335 C360 320,420 300,495 305" class="sketch accent-blue" marker-end="url(#arrow-blue)"/>
  <path d="M285 485 C370 500,420 500,495 480" class="sketch accent-red" stroke-dasharray="10 9" marker-end="url(#arrow-red)"/>
  <text x="360" y="550" text-anchor="middle" class="note red-text">one key overloads one partition</text>
  <path d="M895,160 C965,150 1055,163 1117,158 C1130,230 1123,200 1118,252 C1030,267 965,258 891,255 C880,185 889,215 895,160 Z" class="sketch soft-fill"/>
<text x="1005.0" y="202.5" text-anchor="middle" class="label">Broadcast fix</text>
<text x="1005.0" y="232.5" text-anchor="middle" class="note">copy small side</text>
<text x="1005.0" y="257.5" text-anchor="middle" class="note">avoid big shuffle</text>
  <path d="M895,400 C965,390 1055,403 1117,398 C1130,470 1123,440 1118,492 C1030,507 965,498 891,495 C880,425 889,455 895,400 Z" class="sketch soft-fill"/>
<text x="1005.0" y="442.5" text-anchor="middle" class="label">Salting fix</text>
<text x="1005.0" y="472.5" text-anchor="middle" class="note">split hot key</text>
<text x="1005.0" y="497.5" text-anchor="middle" class="note">then recombine</text>
