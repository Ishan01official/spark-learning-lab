  <path d="M750 500 C820 520,850 470,885 445" class="sketch accent-orange" marker-end="url(#arrow-orange)"/>
  <path d="M805,319.2 C795.0,315.0 811.0,302.0 822.1,310 C853.0,318.0 847.0,353.7 824.0,356.0 C810.0,360.0 797.0,335.3 805,319.2 Z" fill="#202124"/><circle cx="818.3" cy="325.64" r="3.2" fill="#fff"/><circle cx="828.56" cy="326.56" r="3.2" fill="#fff"/><path d="M818.3,356.0 q-6.0,12.0 -16.0,18.0" class="sketch" stroke-width="2.2"/><path d="M828.94,356.0 q7.0,12.0 17.0,18.0" class="sketch" stroke-width="2.2"/><text x="824.0" y="400.0" text-anchor="middle" class="tiny">debugs</text>

</svg>
