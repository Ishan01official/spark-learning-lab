<text x="142.5" y="282.5" text-anchor="middle" class="label">Source</text>
<text x="142.5" y="312.5" text-anchor="middle" class="note">Kafka / files</text>
  <path d="M365,297.5 C335,276.25 365,238.75 410,251.25 C430,215 490,225 505,255.0 C535,226.25 580,276.25 547,307.5 C525,355 395,353 365,297.5 Z" class="sketch soft-fill"/>
<text x="447.5" y="284.5" text-anchor="middle" class="label">Micro-batch</text>
<text x="447.5" y="314.5" text-anchor="middle" class="note">trigger interval</text>
  <path d="M650,215 C720,205 775,218 837,213 C850,285 843,270 838,322 C750,337 720,328 646,325 C635,255 644,270 650,215 Z" class="sketch soft-fill"/>
<text x="742.5" y="265.0" text-anchor="middle" class="label">Processing</text>
<text x="742.5" y="295.0" text-anchor="middle" class="note">DataFrame logic</text>
<text x="742.5" y="320.0" text-anchor="middle" class="note">state updates</text>
  <path d="M980,240 C1050,230 1075,243 1137,238 C1150,310 1143,280 1138,332 C1050,347 1050,338 976,335 C965,265 974,295 980,240 Z" class="sketch sketch-fill"/>
<text x="1057.5" y="282.5" text-anchor="middle" class="label">Sink</text>
<text x="1057.5" y="312.5" text-anchor="middle" class="note">Delta / Kafka</text>
