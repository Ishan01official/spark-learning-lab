  <path d="M345,450 C415,440 495,453 557,448 C570,520 563,490 558,542 C470,557 415,548 341,545 C330,475 339,505 345,450 Z" class="sketch warm-fill"/>
<text x="450.0" y="492.5" text-anchor="middle" class="label">Checkpoint</text>
<text x="450.0" y="522.5" text-anchor="middle" class="note">offsets, commits</text>
<text x="450.0" y="547.5" text-anchor="middle" class="note">resume here</text>
  <path d="M230 285 C275 250,300 255,340 280" class="sketch accent-blue" marker-end="url(#arrow-blue)"/>
  <path d="M555 282 C600 250,615 250,640 270" class="sketch accent-blue" marker-end="url(#arrow-blue)"/>
  <path d="M845 270 C900 250,925 260,970 285" class="sketch accent-blue" marker-end="url(#arrow-blue)"/>
  <path d="M740 330 C720 380,720 410,740 445" class="sketch accent-orange" marker-end="url(#arrow-orange)"/>
  <path d="M540 445 C510 390,495 345,510 300" class="sketch accent-red" stroke-dasharray="10 9" marker-end="url(#arrow-red)"/>
  <text x="455" y="592" text-anchor="middle" class="note blue-text">checkpoint updates after each committed batch</text>
  <path d="M515,354.2 C505.0,350.0 521.0,337.0 532.1,345 C563.0,353.0 557.0,388.7 534.0,391.0 C520.0,395.0 507.0,370.3 515,354.2 Z" fill="#202124"/><circle cx="528.3" cy="360.64" r="3.2" fill="#fff"/><circle cx="538.56" cy="361.56" r="3.2" fill="#fff"/><path d="M528.3,391.0 q-6.0,12.0 -16.0,18.0" class="sketch" stroke-width="2.2"/><path d="M538.94,391.0 q7.0,12.0 17.0,18.0" class="sketch" stroke-width="2.2"/><text x="534.0" y="435.0" text-anchor="middle" class="tiny">records progress</text>

</svg>
